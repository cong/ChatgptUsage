<svg xmlns="http://www.w3.org/2000/svg" viewBox="34 34 188 188" width="256" height="256">
  <defs>
    <!-- 剩余额度渐变:绿(高)→琥珀(中)→红(低),与 app resolveMetricColor 一致 -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#50d67c"/>
      <stop offset="55%" stop-color="#e6b151"/>
      <stop offset="100%" stop-color="#ef5754"/>
    </linearGradient>
  </defs>

  <!-- 轨道(未填充环) -->
  <circle cx="128" cy="128" r="84" fill="none" stroke="#e0e0e0" stroke-width="20"/>

  <!-- 填充环:70% 从顶部顺时针 -->
  <!-- 圆周=2πr≈527.8,70%≈369.5,dash 用此 -->
  <circle cx="128" cy="128" r="84" fill="none" stroke="url(#ring)" stroke-width="20"
          stroke-linecap="round"
          stroke-dasharray="369.5 527.8"
          transform="rotate(-90 128 128)"/>

  <!-- 中心沙漏(重置倒计时,呼应 UI HourglassIcon):整体旋转 180°(原上半空心腔体→下,原下半沙堆→上) -->
  <g transform="rotate(180 128 128)">
    <!-- 下半沙堆(实心三角,顶点对齐中颈 128,128) -->
    <path d="M88 178 H168 L128 128 Z" fill="#50d67c"/>
    <!-- 上半腔体(只画两条腰,不画底边=中颈开口) -->
    <path d="M88 80 L128 128 M168 80 L128 128"
          fill="none" stroke="#50d67c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 上半顶部残沙(一窄条,表示快漏完) -->
    <path d="M92 82 H164 L150 92 H106 Z" fill="#50d67c"/>
    <!-- 中颈下落沙粒 -->
    <rect x="124" y="115" width="8" height="13" rx="2" fill="#50d67c"/>
    <!-- 上下横板 -->
    <rect x="86" y="70" width="84" height="10" rx="3" fill="#50d67c"/>
    <rect x="86" y="176" width="84" height="10" rx="3" fill="#50d67c"/>
  </g>
</svg>
